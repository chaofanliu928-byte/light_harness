# meta-scope.conf - hook 读取的 scope 配置
# 每行一条 glob 规则,! 前缀为排除
# 由 M15 check-meta-review.sh 读
# 文件编码: UTF-8;行尾: LF

# === A 组:governance + 核心规则 ===
docs/governance/*.md
CLAUDE.md
# 入口地图 = 治理面,与 CLAUDE.md 对称(D14);根级文件经 §5.5 root 扫描段命中,audit covers 写 <root>/AGENTS.md
AGENTS.md
# 偏好层:偏好治理上当规范同等对待(D11 ✅ A;审查口径 = 忠实性对照用户原话锚点)
docs/preferences.md

# === B 组:.claude/hooks/* + settings(扩 glob 至 *,line 406 解决)===
# 原 plan/spec 列 .claude/hooks/*.sh 不命中 .conf;扩为 *
# 一并覆盖 *.sh / *.conf / 未来 hook 配置类型(JSON / YAML 等),
# 也使 M17 自身 (.claude/hooks/meta-scope.conf) 入 scope
.claude/hooks/*
.claude/settings.json
.claude/settings.local.json

# === C 组:skills + agents ===
# D15:模板单源化后 skill 捆绑资源 = 契约本体;glob 扩为 */*.md 覆盖 SKILL.md + 捆绑模板(如 structured-handoff/handoff-template.md)
.claude/skills/*/*.md
.claude/agents/*.md

# === D 组:RUBRIC + DESIGN_TEMPLATE ===
docs/RUBRIC.md
docs/references/DESIGN_TEMPLATE.md

# === F 组:setup.sh + 分发模板 ===
# 注:hook cwd=harness/(双层 harness 自身仓库),git diff --relative 输出无 harness/ 前缀,
# 故 glob 用 harness 视角(无前缀)。CLAUDE.md(harness/CLAUDE.md = M4 分发模板)
# 由 A 组 `CLAUDE.md` glob 已覆盖,F 组不重复列。
setup.sh
templates/*.json
# templates/*.md:模板 = 分发契约(事实 3 治理洞:改模板曾永不触发审查);命中 templates/ 下全部 .md(含 context/ 子层;templates/handoff.md 已删 — D3 单源化)
templates/*.md

# === 排除规则(第七轮 fix-9 (v))===
# 只排除流程产出物(audit 文件本身,避免自循环)
# 不排除治理文件(meta-*.sh / meta-*.md / meta-scope.conf)— 治理文件入 scope
!docs/audits/meta-review-*.md
!docs/audits/archive/**

# === E + G 组(scope 外,显式声明)===
# E: 不需列(不命中 scope 内 glob 即等同 scope 外)
# G: 不需列
